<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brim — layout preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#0B1622; --deep:#10263A; --foam:#EAF7F6; --mist:#9DB4BF;
  --lagoon:#2EC4B6; --coral:#FF6B81; --saffron:#FFC24B; --orchid:#9B8CFF; --kelp:#5BD68A; --sky:#5AB8FF;
  --accent:var(--lagoon);
  --text:var(--foam); --text-soft:var(--mist);
  --bg1:#0B1622; --bg2:#10263A; --blob:.26;
  --glass-a:rgba(255,255,255,.17); --glass-b:rgba(255,255,255,.05);
  --frost:rgba(255,255,255,.07); --rim:rgba(255,255,255,.6); --rim-soft:rgba(255,255,255,.10);
  --shadow:rgba(0,0,0,.30); --track:rgba(0,0,0,.30); --spec:rgba(255,255,255,.24);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
:root[data-theme="light"]{
  --text:#0B1F2A; --text-soft:#3F5A66;
  --bg1:#EEF6F5; --bg2:#D9EAE8; --blob:.5;
  --lagoon:#1FA89B; --coral:#E8506A; --saffron:#D99A1E; --orchid:#7E6CF0; --kelp:#39B06B; --sky:#2E97E8;
  --glass-a:rgba(255,255,255,.70); --glass-b:rgba(255,255,255,.30);
  --frost:rgba(255,255,255,.52); --rim:rgba(255,255,255,.98); --rim-soft:rgba(255,255,255,.7);
  --shadow:rgba(20,60,80,.16); --track:rgba(11,31,42,.11); --spec:rgba(255,255,255,.7);
}
[data-view="weekly"]{--accent:var(--saffron)}
[data-view="monthly"]{--accent:var(--orchid)}
:root[data-view="daily"]{--accent:var(--lagoon)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--text);background:#050a10;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- phone frame ---------- */
.phone{
  position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  padding-top:env(safe-area-inset-top,0px);
}
@media (min-width:520px){
  .phone{width:390px;height:min(844px,calc(100vh - 32px));border-radius:52px;
    box-shadow:0 0 0 10px #02060a,0 0 0 11px rgba(255,255,255,.12),0 40px 90px rgba(0,0,0,.6)}
}

/* ---------- aurora ---------- */
.aurora{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:340px;height:340px;border-radius:50%;opacity:var(--blob);will-change:transform;
  animation:drift 38s ease-in-out infinite alternate}
.b1{top:-90px;left:-110px;background:radial-gradient(circle,var(--accent),transparent 66%);opacity:calc(var(--blob) + .08);transition:background 1s}
.b2{top:150px;right:-160px;background:radial-gradient(circle,var(--orchid),transparent 66%);animation-duration:44s;animation-delay:-9s}
.b3{top:470px;left:-140px;background:radial-gradient(circle,var(--coral),transparent 66%);animation-duration:41s;animation-delay:-17s;opacity:calc(var(--blob) - .07)}
.b4{bottom:-120px;right:-60px;background:radial-gradient(circle,var(--saffron),transparent 66%);animation-duration:47s;animation-delay:-25s;opacity:calc(var(--blob) - .05)}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(34px,-46px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

/* ---------- glass primitives ---------- */
.glass{
  position:relative;
  background:linear-gradient(135deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 12px 32px var(--shadow),inset 0 1px 0 var(--spec),inset 0 -1px 0 rgba(255,255,255,.05);
}
.glass::before,.rim::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--rim),rgba(255,255,255,.04) 42%,rgba(255,255,255,.28));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.rim{position:relative}
.frost{
  position:relative;border-radius:28px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c,var(--accent)) 12%,var(--frost)),var(--frost));
  -webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);
  box-shadow:inset 0 1px 0 var(--spec);
}
.frost::before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--rim-soft);pointer-events:none}

/* ---------- screen ---------- */
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 130px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.hello{font-size:13px;color:var(--text-soft);font-weight:500}
h1{font:700 28px/32px var(--display);margin:2px 0 0;letter-spacing:-.3px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

/* segmented */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:48px;border-radius:99px;padding:4px;touch-action:none;user-select:none}
.seg-thumb{
  position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:99px;
  transform:translateX(calc(var(--i,0)*100%));
  transition:transform .5s cubic-bezier(.34,1.35,.5,1),background .6s;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 62%,rgba(255,255,255,.35)),color-mix(in srgb,var(--accent) 30%,transparent) 70%,color-mix(in srgb,var(--accent) 45%,rgba(255,255,255,.2)));
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 1px rgba(255,255,255,.85),inset 0 -2px 5px rgba(255,255,255,.15);
}
.seg-thumb.moving{animation:stretch .42s ease-out}
@keyframes stretch{40%{scale:1.1 .94}}
.seg button{position:relative;z-index:1;font:600 14px var(--body);border-radius:99px;transition:color .3s}
.seg button[aria-selected="true"]{color:#04121a}
:root[data-theme="light"] .seg button[aria-selected="true"]{color:#04121a}

/* navigator */
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 14px}
.nav .mid{display:flex;align-items:center;gap:10px;font:600 17px var(--display)}
.nav .step{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.today-chip{font:600 12px var(--body);padding:6px 12px;border-radius:99px;opacity:0;pointer-events:none;transform:scale(.9);transition:.25s}
.today-chip.show{opacity:1;pointer-events:auto;transform:none}

/* summary */
.summary{padding:18px 18px 16px;margin-bottom:14px}
.sum-top{display:flex;justify-content:space-between;align-items:center}
.big{font:700 56px/56px var(--display);letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.big small{font-size:26px;letter-spacing:0;margin-left:2px}
.of{font-size:13px;color:var(--text-soft);margin-top:4px}
.ring{width:68px;height:68px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--accent);stroke-dasharray:175.9;transition:stroke-dashoffset .5s cubic-bezier(.34,1.2,.5,1),stroke .6s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rim-soft)}
.stat b{display:block;font:700 18px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--text-soft)}
.stat.bad b{color:var(--coral)}
.strip{margin-top:14px;padding-top:14px;border-top:1px solid var(--rim-soft);display:flex;justify-content:space-between;align-items:flex-end}
.dcol{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--text-soft);font-weight:600}
.dcol.now{color:var(--text)}
.dot{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--track) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent 52%,#000 55%);mask:radial-gradient(farthest-side,transparent 52%,#000 55%)}
.dot.empty{background:var(--track);opacity:.55}
.wcol{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--text-soft);font-weight:600;flex:1}
.wbar{width:34px;height:44px;border-radius:12px;background:var(--track);position:relative;overflow:hidden}
.wbar i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v)*1%);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 75%,white),var(--accent));transition:height .5s cubic-bezier(.34,1.2,.5,1)}
.wcol.now{color:var(--text)}

/* filters */
.filters{display:flex;gap:8px;margin:2px 0 14px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;font:600 13px var(--body);color:var(--text-soft);
  background:var(--frost);box-shadow:inset 0 0 0 1px var(--rim-soft);transition:.25s}
.chip[aria-pressed="true"]{color:var(--text);background:color-mix(in srgb,var(--accent) 30%,var(--frost));box-shadow:inset 0 0 0 1px var(--rim),inset 0 1px 0 var(--spec)}
.group-title{font:600 13px var(--body);color:var(--text-soft);margin:6px 4px 10px}

/* work card */
.card{padding:16px 16px 6px;margin-bottom:12px;transition:transform .3s cubic-bezier(.34,1.3,.5,1),opacity .3s}
.card.lift{transform:translateY(-2px) scale(1.01);z-index:3}
.list.dragging-any .card:not(.lift){opacity:.9}
.c-head{display:flex;align-items:flex-start;gap:10px}
.c-dot{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:6px;box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent);flex:none}
.c-title{font:600 18px/24px var(--display);flex:1;min-width:0}
.c-meta{font-size:13px;color:var(--text-soft);margin:2px 0 0 22px}
.badge{flex:none;font:600 12px var(--body);padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:4px}
.badge.over{background:color-mix(in srgb,var(--coral) 24%,transparent);color:var(--coral);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--coral) 45%,transparent)}
.badge.done{background:color-mix(in srgb,var(--kelp) 24%,transparent);color:var(--kelp);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--kelp) 45%,transparent)}
.badge svg{width:12px;height:12px}
.c-bar{display:flex;align-items:center;gap:8px;margin-top:6px}
.pct{width:50px;text-align:right;font:700 17px var(--display);font-variant-numeric:tabular-nums}

/* scrubber */
.scrub{--p:0;--pl:0;position:relative;flex:1;height:48px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:99px}
.scrub.dragging{cursor:grabbing}
.track{position:absolute;left:0;right:0;top:17px;height:14px;border-radius:99px;background:var(--track);overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.10)}
.liquid{position:absolute;left:0;top:0;bottom:0;width:calc(var(--pl)*100%);border-radius:99px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 62%,white) 0,var(--c) 45%,color-mix(in srgb,var(--c) 78%,black) 100%);
  transition:width .45s cubic-bezier(.34,1.35,.5,1)}
.liquid::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;border-radius:99px;
  background:radial-gradient(ellipse at 100% 50%,rgba(255,255,255,.55),transparent 70%)}
.scrub.dragging .liquid{transition:none}
.ticks span{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.32);opacity:0;transition:opacity .2s}
.scrub.dragging .ticks span{opacity:1}
.thumb{
  position:absolute;top:10px;width:40px;height:28px;border-radius:99px;
  left:calc(20px + (100% - 40px)*var(--p));
  transform:translateX(-50%) scale(var(--sx,1),var(--sy,1));
  transition:left .45s cubic-bezier(.34,1.35,.5,1),transform .5s cubic-bezier(.34,1.9,.5,1);
  background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.14) 55%,rgba(255,255,255,.34));
  -webkit-backdrop-filter:blur(5px) saturate(1.7) brightness(1.15);backdrop-filter:blur(5px) saturate(1.7) brightness(1.15);
  box-shadow:0 7px 16px rgba(0,0,0,.34),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -3px 5px rgba(255,255,255,.22),inset 2px 0 3px rgba(255,255,255,.25);
}
.scrub.dragging .thumb{transition:left 0s,transform .12s}
.thumb::after{content:"";position:absolute;left:9px;right:9px;top:4px;height:8px;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.75),transparent)}
.bubble{
  position:absolute;left:calc(20px + (100% - 40px)*var(--p));bottom:calc(100% - 4px);transform:translate(-50%,8px) scale(.7);opacity:0;pointer-events:none;z-index:4;
  padding:6px 12px;border-radius:99px;font:700 15px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;
  transition:.22s cubic-bezier(.34,1.5,.5,1);
  background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.10)),color-mix(in srgb,var(--c) 32%,var(--bg2));box-shadow:0 8px 18px var(--shadow),inset 0 1px 0 var(--spec);
}
.bubble small{display:block;font:500 10px var(--body);color:var(--text-soft);text-align:center;margin-top:-1px}
.scrub.dragging .bubble{opacity:1;transform:translate(-50%,0) scale(1)}
.scrub.brim .liquid{animation:brim .5s ease-out}
@keyframes brim{40%{filter:brightness(1.35) saturate(1.2);box-shadow:0 0 22px var(--c)}}

/* empty */
.empty{text-align:center;padding:34px 20px;color:var(--text-soft)}
.empty svg{width:64px;height:64px;margin-bottom:8px;opacity:.9}
.empty p{margin:0 0 14px;font-size:15px}
.btn{height:44px;padding:0 20px;border-radius:99px;font:600 15px var(--body);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 60%,rgba(255,255,255,.3)),color-mix(in srgb,var(--accent) 28%,transparent))}

/* tab bar */
.dock{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:12px;align-items:center;z-index:5;
  transition:transform .35s cubic-bezier(.34,1.2,.5,1),opacity .25s}
.dock.hide{transform:translateY(110px);opacity:0}
.tabs{position:relative;flex:1;height:64px;border-radius:99px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.lens{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:99px;transform:translateX(calc(var(--t,0)*100%));
  transition:transform .5s cubic-bezier(.34,1.35,.5,1);
  background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 60%,rgba(255,255,255,.2));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 4px rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.18)}
.tab{position:relative;z-index:1;display:grid;justify-items:center;align-content:center;gap:2px;font:600 11px var(--body);color:var(--text-soft)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--text)}
.plus{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,rgba(255,255,255,.3)),color-mix(in srgb,var(--accent) 22%,transparent) 70%,color-mix(in srgb,var(--accent) 40%,rgba(255,255,255,.2)))}
.plus svg{width:26px;height:26px}
.plus:active,.tab:active,.icon-btn:active,.step:active{transform:scale(.94)}

/* toast */
.toast{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:7;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 10px 10px 18px;border-radius:99px;font:500 14px var(--body);opacity:0;transform:translateY(16px);pointer-events:none;transition:.26s cubic-bezier(.34,1.3,.5,1)}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{font:700 14px var(--body);color:var(--accent);padding:8px 14px;border-radius:99px}

/* sheet */
.scrim{position:absolute;inset:0;z-index:8;background:rgba(3,10,16,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 20px);border-radius:36px 36px 0 0;transform:translateY(105%);transition:transform .5s cubic-bezier(.34,1.15,.5,1)}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:99px;background:var(--text-soft);opacity:.5;margin:0 auto 14px}
.sheet h2{font:700 24px var(--display);margin:0 0 14px}
.field{display:grid;gap:6px;margin-bottom:14px;font-size:13px;color:var(--text-soft);font-weight:600}
.field input{height:48px;border-radius:16px;border:0;padding:0 14px;font:500 16px var(--body);color:var(--text);background:var(--track);box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.field input:focus{outline:2px solid color-mix(in srgb,var(--accent) 65%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.note{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#7d97a4;pointer-events:none}
@media (max-width:519px){.note{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-tasks" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.8 12.3l2.9 2.9 5.6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M3.5 10h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-ins" viewBox="0 0 24 24"><path d="M6 20V12M12 20V5M18 20v-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="16" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="phone" id="phone">
  <div class="aurora" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>

  <main class="screen" id="screen">
    <div class="top">
      <div><div class="hello">Good evening</div><h1>Tasks</h1></div>
      <button class="icon-btn glass" id="themeBtn" aria-label="Switch light or dark theme"><svg><use href="#i-sun"/></svg></button>
    </div>

    <div class="seg glass" id="seg" role="tablist" aria-label="Period">
      <div class="seg-thumb" id="segThumb"></div>
      <button role="tab" data-v="daily" aria-selected="true">Daily</button>
      <button role="tab" data-v="weekly" aria-selected="false">Weekly</button>
      <button role="tab" data-v="monthly" aria-selected="false">Monthly</button>
    </div>

    <div class="nav">
      <button class="step glass" id="prev" aria-label="Previous period">‹</button>
      <div class="mid"><span id="navLabel"></span><button class="today-chip glass" id="todayBtn">Today</button></div>
      <button class="step glass" id="next" aria-label="Next period">›</button>
    </div>

    <section class="summary frost" id="summary" aria-label="Period summary"></section>

    <div class="filters" id="filters" role="group" aria-label="Filter works"></div>
    <div class="list" id="list"></div>
  </main>

  <div class="dock" id="dock">
    <nav class="tabs glass" id="tabs" aria-label="Main">
      <div class="lens" id="lens"></div>
      <button class="tab" role="tab" aria-selected="true" data-t="0"><svg><use href="#i-tasks"/></svg>Tasks</button>
      <button class="tab" role="tab" aria-selected="false" data-t="1"><svg><use href="#i-cal"/></svg>Calendar</button>
      <button class="tab" role="tab" aria-selected="false" data-t="2"><svg><use href="#i-ins"/></svg>Insights</button>
      <button class="tab" role="tab" aria-selected="false" data-t="3"><svg><use href="#i-set"/></svg>Settings</button>
    </nav>
    <button class="plus glass" id="plus" aria-label="Add work"><svg><use href="#i-plus"/></svg></button>
  </div>

  <div class="toast glass" id="toast" role="status"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet glass" id="sheet" role="dialog" aria-label="New work" aria-hidden="true">
    <div class="grab"></div>
    <h2>New work</h2>
    <label class="field">Title<input id="fTitle" type="text" maxlength="120" placeholder="e.g. Write results section" autocomplete="off"></label>
    <div class="field">Repeats
      <div class="row" id="fCad">
        <button class="chip" aria-pressed="true" data-c="daily">Daily</button>
        <button class="chip" aria-pressed="false" data-c="weekly">Weekly</button>
        <button class="chip" aria-pressed="false" data-c="monthly">Monthly</button>
        <button class="chip" aria-pressed="false" data-c="once">One-off</button>
      </div>
    </div>
    <div class="field">Colour
      <div class="row" id="fCol"></div>
    </div>
    <div class="actions"><button class="btn glass" id="fCancel">Cancel</button><button class="btn primary glass" id="fAdd">Add work</button></div>
  </div>

</div>
<div class="note">Preview with sample data. Real refraction is rendered by Flutter; this page approximates it with blur and light.</div>

<script>
(() => {
  'use strict';
  const $ = (s, r=document) => r.querySelector(s);
  const root = document.documentElement;
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const TODAY = new Date(2026, 8, 24); // sample "today": Thu 24 Sep 2026
  const VIEWS = ['daily','weekly','monthly'];
  const COLORS = ['lagoon','coral','saffron','orchid','kelp','sky'];

  const WORKS = [
    {id:'gym',  title:'Gym',                    meta:'Health · every day',       color:'kelp',    cadence:'daily',   effort:1, initial:100},
    {id:'read', title:'Read 20 pages',          meta:'Learning · every day',     color:'orchid',  cadence:'daily',   effort:1, initial:40},
    {id:'log',  title:'Update experiment log',  meta:'Research · every day',     color:'lagoon',  cadence:'daily',   effort:2, initial:65},
    {id:'inbox',title:'Clear inbox',            meta:'Admin · weekdays',         color:'saffron', cadence:'daily',   effort:1, initial:0},
    {id:'rev',  title:'Reviewer response',      meta:'Writing · due Tue',        color:'coral',   cadence:'once', appear:'daily',   effort:3, initial:45, overdue:true},
    {id:'meth', title:'Write methods section',  meta:'Thesis · this week',       color:'lagoon',  cadence:'weekly',  effort:2, initial:45},
    {id:'exp',  title:'Run experiments',        meta:'Research · this week',     color:'orchid',  cadence:'weekly',  effort:3, initial:70},
    {id:'wrev', title:'Weekly review',          meta:'Planning · Sundays',       color:'saffron', cadence:'weekly',  effort:1, initial:0},
    {id:'abs',  title:'Send abstract',          meta:'Conference · due Fri',     color:'coral',   cadence:'once', appear:'weekly',  effort:2, initial:20},
    {id:'rep',  title:'Monthly report',         meta:'Work · due 30 Sep',        color:'coral',   cadence:'monthly', effort:2, initial:30},
    {id:'data', title:'Expand dataset',         meta:'Research · this month',    color:'lagoon',  cadence:'monthly', effort:3, initial:55},
    {id:'draft',title:'Paper draft v2',         meta:'Thesis · this month',      color:'orchid',  cadence:'monthly', effort:3, initial:60},
  ];
  const state = {view:'daily', offset:{daily:0,weekly:0,monthly:0}, filter:'all', step:5, tab:0};
  const store = {};           // "id|periodKey" -> percent (only for values the user changed)
  let newColor = 'lagoon', newCad = 'daily';

  /* ---------- helpers ---------- */
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const hash = s => { let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619);} return h>>>0; };
  const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
  const weekStart = d => addDays(d, -((d.getDay()+6)%7));
  const colorVar = c => `var(--${c})`;
  const pk = v => v[0] + state.offset[v];
  const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

  function getPct(w, view=state.view, off=state.offset[view]){
    const k = w.id + '|' + view[0] + off;
    if (k in store) return store[k];
    if (off === 0) return w.initial ?? 0;
    if (off < 0) return Math.round((30 + hash(k) % 71) / 5) * 5;
    return 0;
  }
  function itemsFor(view, off=state.offset[view]){
    const off0 = off === 0;
    return WORKS.filter(w => w.cadence === view || (w.cadence === 'once' && w.appear === view && off0));
  }
  function rollup(list, view, off=state.offset[view]){
    let w=0, s=0; for (const x of list){ w += x.effort; s += x.effort * getPct(x, view, off); }
    return w ? s / w : 0;
  }
  function dayAvg(i){ // weekly strip: Mon..Sun of the viewed week
    const off = state.offset.weekly;
    if (off > 0) return null;
    if (off === 0){
      const todayIdx = (TODAY.getDay()+6)%7;
      if (i > todayIdx) return null;
      if (i === todayIdx) return rollup(itemsFor('daily',0), 'daily', 0);
      return [85,60,72,0,0,0,0][i];
    }
    return 30 + hash('d'+off+i) % 71;
  }
  function weekAvg(i){ // monthly strip: 5 weeks
    const off = state.offset.monthly;
    if (off > 0) return null;
    if (off === 0){ if (i === 3) return rollup(itemsFor('weekly',0),'weekly',0); return [88,72,64,0,null][i]; }
    return i === 4 && hash('m'+off) % 2 ? null : 30 + hash('w'+off+i) % 71;
  }

  /* ---------- labels ---------- */
  function navLabel(){
    const v = state.view, off = state.offset[v];
    if (v === 'daily'){ const d = addDays(TODAY, off); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
    if (v === 'weekly'){
      const s = addDays(weekStart(TODAY), 7*off), e = addDays(s, 6);
      return s.getMonth() === e.getMonth() ? `${s.getDate()} – ${e.getDate()} ${MONTHS[e.getMonth()]}` : `${s.getDate()} ${MONTHS[s.getMonth()]} – ${e.getDate()} ${MONTHS[e.getMonth()]}`;
    }
    const m = new Date(2026, 8 + off, 1); return `${FULL[m.getMonth()]} ${m.getFullYear()}`;
  }
  const ofLabel = () => {
    const off = state.offset[state.view];
    return {daily: off?'of that day':'of today', weekly: off?'of that week':'of this week', monthly: off?'of that month':'of this month'}[state.view];
  };
  const todayLabel = {daily:'Today', weekly:'This week', monthly:'This month'};
  const streakLabel = {daily:'day streak', weekly:'week streak', monthly:'month streak'};
  const streakVal = {daily:6, weekly:3, monthly:2};

  /* ---------- render ---------- */
  function renderNav(){
    $('#navLabel').textContent = navLabel();
    const chip = $('#todayBtn'); chip.textContent = todayLabel[state.view];
    chip.classList.toggle('show', state.offset[state.view] !== 0);
  }

  let shownBig = 0;
  function tween(el, to){
    const from = shownBig, t0 = performance.now(), d = 320;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce){ el.textContent = Math.round(to); shownBig = to; return; }
    (function f(t){
      const k = clamp((t - t0) / d, 0, 1), e = 1 - Math.pow(1 - k, 3);
      shownBig = from + (to - from) * e; el.textContent = Math.round(shownBig);
      if (k < 1) requestAnimationFrame(f);
    })(t0);
  }
  function renderSummary(animate=true){
    const v = state.view, list = itemsFor(v);
    const overall = rollup(list, v);
    const done = list.filter(w => getPct(w,v) === 100).length;
    const over = list.filter(w => w.overdue && getPct(w,v) < 100).length;
    let extra = '';
    if (v === 'weekly'){
      const nowIdx = state.offset.weekly === 0 ? (TODAY.getDay()+6)%7 : -1;
      extra = '<div class="strip" aria-label="Daily averages for the week">' + 'MTWTFSS'.split('').map((l,i)=>{
        const a = dayAvg(i);
        return `<div class="dcol ${i===nowIdx?'now':''}"><div class="dot ${a==null?'empty':''}" style="--v:${a==null?0:Math.round(a)}"></div>${l}</div>`;
      }).join('') + '</div>';
    }
    if (v === 'monthly'){
      const nowIdx = state.offset.monthly === 0 ? 3 : -1;
      extra = '<div class="strip" aria-label="Weekly averages for the month">' + [0,1,2,3,4].map(i=>{
        const a = weekAvg(i);
        return `<div class="wcol ${i===nowIdx?'now':''}"><div class="wbar"><i style="--v:${a==null?0:Math.round(a)}"></i></div>W${i+1}</div>`;
      }).join('') + '</div>';
    }
    const el = $('#summary');
    if (!el.dataset.built || el.dataset.view !== v){
      el.dataset.built = '1'; el.dataset.view = v;
      el.innerHTML = `
        <div class="sum-top">
          <div><div class="big"><span id="bigNum">0</span><small>%</small></div><div class="of" id="ofLbl"></div></div>
          <svg class="ring" viewBox="0 0 68 68" aria-hidden="true"><circle class="bg" cx="34" cy="34" r="28"/><circle class="fg" id="ringFg" cx="34" cy="34" r="28" stroke-dashoffset="175.9"/></svg>
        </div>
        <div class="stats">
          <div class="stat"><b id="sDone"></b><span>Done</span></div>
          <div class="stat"><b id="sLeft"></b><span>Left</span></div>
          <div class="stat" id="sOverBox"><b id="sOver"></b><span>Overdue</span></div>
          <div class="stat"><b id="sStreak"></b><span id="sStreakL"></span></div>
        </div>
        <div id="sExtra"></div>`;
      shownBig = 0;
    }
    $('#ofLbl').textContent = ofLabel();
    $('#sDone').textContent = `${done}/${list.length}`;
    $('#sLeft').textContent = list.length - done;
    $('#sOver').textContent = over;
    $('#sOverBox').classList.toggle('bad', over > 0);
    $('#sStreak').textContent = streakVal[v] + (v==='daily'?'d':v==='weekly'?'w':'m');
    $('#sStreakL').textContent = streakLabel[v];
    $('#sExtra').innerHTML = extra;
    $('#ringFg').style.strokeDashoffset = 175.9 * (1 - overall/100);
    if (animate) tween($('#bigNum'), overall); else { shownBig = overall; $('#bigNum').textContent = Math.round(overall); }
  }

  function renderFilters(){
    const list = itemsFor(state.view);
    const c = {all:list.length, active:list.filter(w=>getPct(w)<100).length, done:list.filter(w=>getPct(w)===100).length, overdue:list.filter(w=>w.overdue&&getPct(w)<100).length};
    $('#filters').innerHTML = [['all','All'],['active','Active'],['done','Done'],['overdue','Overdue']]
      .map(([k,l]) => `<button class="chip" data-f="${k}" aria-pressed="${state.filter===k}">${l} ${c[k]}</button>`).join('');
  }

  function cardHTML(w){
    const p = getPct(w), isDone = p === 100, isOver = w.overdue && !isDone;
    const badge = isDone ? `<span class="badge done"><svg><use href="#i-check"/></svg>Done</span>` : isOver ? `<span class="badge over">Overdue</span>` : '';
    return `<article class="card frost" data-id="${w.id}" style="--c:${colorVar(w.color)}">
      <div class="c-head"><span class="c-dot"></span><div class="c-title">${esc(w.title)}</div>${badge}</div>
      <div class="c-meta">${esc(w.meta)}</div>
      <div class="c-bar">
        <div class="scrub" data-id="${w.id}" role="slider" tabindex="0" aria-label="Progress, ${esc(w.title)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}" aria-valuetext="${p} percent" style="--p:${p/100};--pl:${p/100}">
          <div class="track"><div class="liquid"></div><div class="ticks"><span style="left:25%"></span><span style="left:50%"></span><span style="left:75%"></span></div></div>
          <div class="thumb"></div>
          <div class="bubble"><span class="bv">${p}%</span><small class="hint"></small></div>
        </div>
        <div class="pct">${p}%</div>
      </div></article>`;
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function renderList(){
    const v = state.view; let list = itemsFor(v);
    list = list.filter(w => { const p=getPct(w); return state.filter==='all' || (state.filter==='active'&&p<100) || (state.filter==='done'&&p===100) || (state.filter==='overdue'&&w.overdue&&p<100); });
    const title = {daily:'Daily works', weekly:'Weekly works', monthly:'Monthly works'}[v];
    $('#list').innerHTML = list.length
      ? `<div class="group-title">${title}</div>` + list.map(cardHTML).join('')
      : `<div class="empty frost"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 8h28l-3 40a10 10 0 0 1-10 9h-2a10 10 0 0 1-10-9z"/><circle cx="32" cy="34" r="2.6"/><circle cx="38" cy="26" r="1.8"/></svg><p>Nothing here yet. Add a work to start filling.</p><button class="btn primary glass" data-add>Add work</button></div>`;
  }

  function renderAll(animate=true){ root.dataset.view = state.view; renderNav(); renderSummary(animate); renderFilters(); renderList(); }

  function refreshCard(id){
    const old = $(`.card[data-id="${id}"]`); if (!old) return;
    const w = WORKS.find(x => x.id === id);
    const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(w);
    old.replaceWith(tmp.firstElementChild);
  }

  /* ---------- toast ---------- */
  let toastTimer, undoFn = null;
  function toast(text, undo){
    $('#toastText').textContent = text; undoFn = undo || null;
    $('#toastUndo').style.display = undo ? '' : 'none';
    $('#toast').classList.add('show'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4000);
  }
  $('#toastUndo').addEventListener('click', () => { if (undoFn){ undoFn(); buzz(8); } $('#toast').classList.remove('show'); });

  /* ---------- progress scrubber ---------- */
  let drag = null;
  const list = $('#list');

  function commit(id, value, prev){
    const key = id + '|' + pk(state.view);
    store[key] = value;
    refreshCard(id); renderSummary(); renderFilters();
    if (value === 100 && prev < 100){
      buzz([12,60,8]);
      const sc = $(`.scrub[data-id="${id}"]`); if (sc){ sc.classList.add('brim'); setTimeout(()=>sc.classList.remove('brim'), 520); }
    }
    if (value !== prev){
      toast(`Set to ${value}%`, () => { store[key] = prev; refreshCard(id); renderSummary(); renderFilters(); });
    }
  }

  list.addEventListener('pointerdown', e => {
    const sc = e.target.closest('.scrub'); if (!sc || (e.pointerType==='mouse' && e.button!==0)) return;
    const w = WORKS.find(x => x.id === sc.dataset.id), p = getPct(w);
    const r = sc.querySelector('.track').getBoundingClientRect();
    drag = {sc, w, pid:e.pointerId, startX:e.clientX, lastX:e.clientX, lastT:performance.now(), started:false, raw:p, last:p, prev:p, rect:r};
  });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag;
    if (!d.started){
      if (Math.abs(e.clientX - d.startX) < 6) return;
      d.started = true; d.lastX = e.clientX;
      d.sc.classList.add('dragging'); d.sc.closest('.card').classList.add('lift'); list.classList.add('dragging-any');
      try{ d.sc.setPointerCapture(e.pointerId); }catch(_){}
      return;
    }
    const dy = Math.abs(e.clientY - (d.rect.top + d.rect.height/2));
    const factor = dy <= 40 ? 1 : dy <= 100 ? .5 : .25;
    d.raw = clamp(d.raw + (e.clientX - d.lastX) / d.rect.width * 100 * factor, 0, 100);
    const now = performance.now(), v = (e.clientX - d.lastX) / Math.max(1, now - d.lastT) * 1000;
    d.lastX = e.clientX; d.lastT = now;
    const step = factor < 1 ? 1 : state.step;
    let s = Math.round(d.raw / step) * step;
    for (const m of [0,25,50,75,100]) if (Math.abs(s - m) <= 2) s = m;   // magnetic detents
    s = clamp(s, 0, 100);
    const sc = d.sc;
    sc.style.setProperty('--pl', d.raw / 100);
    sc.style.setProperty('--p', s / 100);
    sc.style.setProperty('--sx', 1 + Math.min(.12, Math.abs(v) / 6000));
    sc.style.setProperty('--sy', 1 - Math.min(.06, Math.abs(v) / 12000));
    sc.querySelector('.hint').textContent = factor === 1 ? '' : factor === .5 ? 'half speed' : 'quarter speed';
    if (s !== d.last){
      d.last = s;
      sc.querySelector('.bv').textContent = s + '%';
      sc.parentElement.querySelector('.pct').textContent = s + '%';
      sc.setAttribute('aria-valuenow', s); sc.setAttribute('aria-valuetext', s + ' percent');
      store[d.w.id + '|' + pk(state.view)] = s;
      renderSummary(false);
      buzz([([25,50,75].includes(s)) ? 14 : 5]);
    }
  });
  function endDrag(cancel){
    if (!drag) return; const d = drag; drag = null;
    list.classList.remove('dragging-any');
    if (!d.started) return;
    d.sc.classList.remove('dragging'); d.sc.style.removeProperty('--sx'); d.sc.style.removeProperty('--sy');
    d.sc.closest('.card')?.classList.remove('lift');
    const key = d.w.id + '|' + pk(state.view);
    if (cancel){ store[key] = d.prev; refreshCard(d.w.id); renderSummary(); renderFilters(); return; }
    d.sc.style.setProperty('--pl', d.last / 100);
    const prev = d.prev; store[key] = d.prev;   // commit() writes the final value and builds the undo
    commit(d.w.id, d.last, prev);
  }
  window.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pid) endDrag(false); });
  window.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) endDrag(true); });

  list.addEventListener('dblclick', e => {           // double-tap the thumb = 100%
    if (!e.target.closest('.thumb')) return;
    const sc = e.target.closest('.scrub'), w = WORKS.find(x => x.id === sc.dataset.id);
    commit(w.id, 100, getPct(w));
  });
  list.addEventListener('keydown', e => {            // keyboard / accessibility
    const sc = e.target.closest('.scrub'); if (!sc) return;
    const w = WORKS.find(x => x.id === sc.dataset.id), p = getPct(w); let n = p;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') n = p + state.step;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') n = p - state.step;
    else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = 100; else return;
    e.preventDefault(); commit(w.id, clamp(n,0,100), p);
    $(`.scrub[data-id="${w.id}"]`)?.focus();
  });
  list.addEventListener('click', e => {
    if (e.target.closest('[data-add]')) openSheet();
  });

  /* ---------- controls ---------- */
  $('#filters').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    state.filter = b.dataset.f; renderFilters(); renderList(); buzz(4);
  });

  function setView(v, moving=true){
    if (v === state.view) return;
    state.view = v; state.filter = 'all';
    const i = VIEWS.indexOf(v);
    $('#seg').style.setProperty('--i', i); $('#segThumb').style.setProperty('--i', i);
    document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
    if (moving){ const t = $('#segThumb'); t.classList.remove('moving'); void t.offsetWidth; t.classList.add('moving'); }
    buzz(5); renderAll();
  }
  $('#seg').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) setView(b.dataset.v); });
  (function segDrag(){
    const seg = $('#seg'); let down = false;
    const idx = e => { const r = seg.getBoundingClientRect(); return clamp(Math.floor((e.clientX - r.left) / r.width * 3), 0, 2); };
    seg.addEventListener('pointerdown', e => { down = true; });
    window.addEventListener('pointermove', e => { if (down && e.buttons) setView(VIEWS[idx(e)]); });
    window.addEventListener('pointerup', () => { down = false; });
  })();
  $('#segThumb').style.setProperty('--i', 0);
  $('#seg').style.setProperty('--i', 0);

  const shift = n => { state.offset[state.view] += n; buzz(4); renderAll(); };
  $('#prev').addEventListener('click', () => shift(-1));
  $('#next').addEventListener('click', () => shift(1));
  $('#todayBtn').addEventListener('click', () => { state.offset[state.view] = 0; renderAll(); });

  $('#themeBtn').addEventListener('click', () => {
    const light = root.dataset.theme !== 'light';
    root.dataset.theme = light ? 'light' : 'dark';
    $('#themeBtn use').setAttribute('href', '#i-sun');
  });

  /* tab bar */
  document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => {
    const t = +b.dataset.t; state.tab = t; buzz(5);
    $('#lens').style.setProperty('--t', t);
    document.querySelectorAll('#tabs .tab').forEach(x => x.setAttribute('aria-selected', x === b));
    if (t !== 0) toast('This preview covers the Tasks screen only.');
  }));
  let lastY = 0;
  $('#screen').addEventListener('scroll', e => {
    const y = e.target.scrollTop, dy = y - lastY;
    if (dy > 4 && y > 120) $('#dock').classList.add('hide');
    else if (dy < -4 || y < 120) $('#dock').classList.remove('hide');
    lastY = y;
  }, {passive:true});

  /* add sheet */
  const swatches = $('#fCol');
  swatches.innerHTML = COLORS.map(c => `<button class="chip" data-col="${c}" aria-pressed="${c===newColor}" aria-label="${c}" style="width:34px;padding:0;background:${colorVar(c)}"></button>`).join('');
  function openSheet(){ $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); $('#sheet').setAttribute('aria-hidden','false'); setTimeout(()=>$('#fTitle').focus(), 350); }
  function closeSheet(){ $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); $('#sheet').setAttribute('aria-hidden','true'); $('#fTitle').value=''; }
  $('#plus').addEventListener('click', openSheet);
  $('#scrim').addEventListener('click', closeSheet);
  $('#fCancel').addEventListener('click', closeSheet);
  $('#fCad').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; newCad = b.dataset.c; document.querySelectorAll('#fCad .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  swatches.addEventListener('click', e => { const b = e.target.closest('[data-col]'); if (!b) return; newColor = b.dataset.col; swatches.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#fAdd').addEventListener('click', () => {
    const t = $('#fTitle').value.trim();
    if (!t){ $('#fTitle').focus(); toast('Give this work a title.'); return; }
    const appear = newCad === 'once' ? state.view : null;
    const w = {id:'n'+Date.now(), title:t, meta: newCad==='once' ? 'One-off · added now' : {daily:'Every day',weekly:'This week',monthly:'This month'}[newCad], color:newColor, cadence:newCad, appear, effort:1, initial:0};
    WORKS.push(w); closeSheet();
    const target = newCad === 'once' ? state.view : newCad;
    state.offset[target] = 0;
    if (target !== state.view) setView(target); else renderAll();
    toast('Added “' + t + '”');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  renderAll(false);
  shownBig = 0; tween($('#bigNum'), rollup(itemsFor('daily'), 'daily'));
  $('#fTitle').addEventListener('keydown', e => { if (e.key === 'Enter') $('#fAdd').click(); });
})();
</script>
</body>
</html>
